
# certbot certonly --manual \
#   --preferred-challenges dns \
#   -d portex.space \
#   -d '*.portex.space' \
#   --agree-tos \
#   --email your-email@example.com

# Please deploy a DNS TXT record under the name:
# _acme-challenge.portex.space

# with the following value:
# abc123xyz...

# Bu TXT kaydını Cloudflare DNS'e ekleyin:

# Cloudflare Dashboard → DNS
# Add record
# Type: TXT
# Name: _acme-challenge
# Content: (certbot'un verdiği değer)
# Save
# Sonra certbot'ta Enter'a basın. Sertifika alındıktan sonra:


# Portex Nginx Configuration
# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name portex.space *.portex.space;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Laravel Backend (ONLY portex.space - NO subdomains!)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portex.space;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/portex.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portex.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Laravel root
    root /var/www/portex/public;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/portex-backend.access.log;
    error_log /var/log/nginx/portex-backend.error.log;

    # WebSocket endpoint for Reverb
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-lived connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# HTTPS - Tunnel Traffic (ALL subdomains go to Go server)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.portex.space;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/portex.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portex.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logs
    access_log /var/log/nginx/portex-tunnels.access.log;
    error_log /var/log/nginx/portex-tunnels.error.log;

    # Proxy ALL traffic to Go server
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
